name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 安装依赖（runner 自带 bash 3.2，脚本需要 ≥ 4.2）
        run: brew install bash jq
      - name: 版本（arm runner 在 /opt/homebrew，intel 在 /usr/local）
        run: |
          for b in /opt/homebrew/bin/bash /usr/local/bin/bash; do
            [ -x "$b" ] && "$b" --version | head -1
          done
          python3 --version
          jq --version
      - name: 语法检查
        run: |
          BASH=/bin/bash
          for b in /opt/homebrew/bin/bash /usr/local/bin/bash; do [ -x "$b" ] && BASH=$b && break; done
          for f in src/*.sh install.sh run_tests.sh tools/preview.sh tools/doctor.sh tools/doctor/*.sh tools/lib/*.sh; do "$BASH" -n "$f"; done
          python3 -m py_compile src/*.py tests/*.py
      - name: 跑测试（隔离沙箱，不联网）
        run: bash run_tests.sh

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: 版本
        run: |
          bash --version | head -1
          python3 --version
          jq --version
      - name: 语法检查
        run: |
          for f in src/*.sh install.sh run_tests.sh tools/preview.sh tools/doctor.sh tools/doctor/*.sh tools/lib/*.sh; do bash -n "$f"; done
          python3 -m py_compile src/*.py tests/*.py
      # SC2034 / SC2154（未用 / 未赋值）整类关掉：变量靠 read 名单、printf -v 与跨文件 source 赋值，
      # shellcheck 跟不到；其余 warning 要么改掉，要么在行内写明理由后豁免。
      - name: shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -s bash -S warning -e SC2034,SC2154 src/*.sh install.sh run_tests.sh tools/preview.sh tools/doctor.sh tools/doctor/*.sh tools/lib/*.sh
      # 全量：渲染 / tokens / 色板三个模块也要在这里的 bash 与 jq 版本上跑一遍
      # （2026-11-17 裁定，此前只跑平台敏感子集）。
      - name: 跑测试（全量，并发用例除外）
        env:
          # 该 runner 上两个独立进程能在约 2µs 内同时 mkdir 同一条路径成功（实测，见
          # docs/DECISIONS.md），锁语义无法在这里验证；并发用例仍由 macOS 全量覆盖。
          CCPILLS_SKIP_CONCURRENCY: '1'
        run: bash run_tests.sh

  # python 3.9 是支持的下限（PY_MIN，str.removesuffix）。runner 自带的 python 更新，下限
  # 此前只在 README 里声明；这里用 3.9 跑全量——测试本身与两个助手都在这个版本上跑。
  python39:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # actions/setup-python 在新版 ubuntu runner 上已没有 3.9 的构建；用 uv 装 python-build-standalone
      # 的 3.9，把它的 bin（含 python3）放到 PATH 最前
      - uses: astral-sh/setup-uv@v6
      - name: 安装 python 3.9
        run: |
          uv python install 3.9
          dirname "$(uv python find 3.9)" >> "$GITHUB_PATH"
      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: 版本
        run: |
          python3 --version
          [ "$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" = 3.9 ]
      - name: 跑测试（python 3.9；并发用例除外）
        env:
          CCPILLS_SKIP_CONCURRENCY: '1'
        run: bash run_tests.sh

  # bash 4.2 是支持的下限（关联数组、printf %(…)T）。发行版早已不带这么旧的 bash，只能源码编译；
  # 编译产物按版本缓存。此前只在 2026-10-31 手工验证过一次，之后改动同步路径都没有复跑。
  bash42:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: bash 4.2 编译缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/bash42
          key: bash-4.2-${{ runner.os }}-${{ runner.arch }}-v2   # v2：让一次编译真正走过 sha256 校验
      - name: 源码编译 bash 4.2
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq build-essential bison     # 只有缓存未命中才要编译工具链
          # sha256 与 Homebrew 历史 bash 公式里记的 bash-4.2.tar.gz 一致（11-20 本机下载核对）
          curl -fsSL -o bash-4.2.tar.gz https://ftp.gnu.org/gnu/bash/bash-4.2.tar.gz
          echo 'a27a1179ec9c0830c65c6aa5d7dab60f7ce1a2a608618570f96bfa72e95ab3d8  bash-4.2.tar.gz' | sha256sum -c -
          tar xzf bash-4.2.tar.gz
          cd bash-4.2
          # 2011 年的 K&R 风格 C：新编译器默认 C23，把「void f()」当成无参、隐式声明当错误。
          # -std 写进 CC 而不是 CFLAGS：builtins/ 里给构建机用的工具（mkbuiltins）不吃 CFLAGS。
          ./configure --prefix="$HOME/bash42" --without-bash-malloc CC='gcc -std=gnu89 -w' CFLAGS='-O2'
          make -j4
          make install
      - name: 版本
        run: |
          "$HOME/bash42/bin/bash" --version | head -1
          python3 --version
          jq --version
      - name: 跑测试（PATH 里的 bash 换成 4.2；并发用例除外）
        env:
          CCPILLS_SKIP_CONCURRENCY: '1'
        run: |
          export PATH="$HOME/bash42/bin:$PATH"
          [ "$(bash -c 'echo ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}')" = 4.2 ]
          bash run_tests.sh
