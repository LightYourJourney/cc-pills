name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: 安装依赖（runner 自带 bash 3.2，脚本需要 ≥ 4.2）
        run: brew install bash jq
      - name: 版本（arm runner 在 /opt/homebrew，intel 在 /usr/local）
        run: |
          for b in /opt/homebrew/bin/bash /usr/local/bin/bash; do
            [ -x "$b" ] && "$b" --version | head -1
          done
          python3 --version
          jq --version
      - name: 语法检查
        run: |
          BASH=/bin/bash
          for b in /opt/homebrew/bin/bash /usr/local/bin/bash; do [ -x "$b" ] && BASH=$b && break; done
          for f in src/*.sh install.sh run_tests.sh tools/preview.sh tools/doctor.sh tools/doctor/*.sh; do "$BASH" -n "$f"; done
          python3 -m py_compile src/*.py tests/*.py
      - name: 跑测试（隔离沙箱，不联网）
        run: bash run_tests.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: 版本
        run: |
          bash --version | head -1
          python3 --version
          jq --version
      - name: 语法检查
        run: |
          for f in src/*.sh install.sh run_tests.sh tools/preview.sh tools/doctor.sh tools/doctor/*.sh; do bash -n "$f"; done
          python3 -m py_compile src/*.py tests/*.py
      # 子集：平台敏感的缓存 / 面板 / 时效 / 安装 / 诊断。完整套件留在 macOS runner
      # （golden 与配色矩阵是平台无关的纯计算，改它们时 macOS 作业会覆盖）。
      - name: 平台敏感子集
        env:
          # 该 runner 上两个独立进程能在约 2µs 内同时 mkdir 同一条路径成功（实测，见
          # docs/DECISIONS.md），锁语义无法在这里验证；并发用例仍由 macOS 全量覆盖。
          CCPILLS_SKIP_CONCURRENCY: '1'
        run: bash run_tests.sh cache subagent freshness install doctor
